<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buffer-queue</title>
<style>
:root{--bg:#F7F5EF;--card:#fff;--line:#D9D3C3;--ink:#1F2933;--mute:#52606D;--green:#1F4E46;--soft:#DDE9E5;--warn:#B54708;--warnbg:#FEF0C7}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1d2328;--line:#34404a;--ink:#E4E7EB;--mute:#9AA5B1;--green:#7FC8B8;--soft:#223a35;--warn:#F5B661;--warnbg:#3a2d12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.tab[aria-pressed=true]{background:var(--green);color:var(--card);border-color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card.locked{opacity:.85}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--warnbg);color:var(--warn)}
.badge.approved{background:var(--soft);color:var(--green)}
.badge.scheduled{background:var(--green);color:var(--card)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 4px}
textarea,input[type=datetime-local]{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input[type=datetime-local]{width:auto}
.count{float:right;font-weight:400}
.count.over{color:#C23616;font-weight:700}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button.act{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--green);color:var(--card);border-color:var(--green);font-weight:600}
button.del{color:#C23616;margin-left:auto}
a.src{font-size:13px;color:var(--mute)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
#msg{color:var(--mute);font-size:14px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
</style>
</head>
<body>
<main>
  <h1>Your queue</h1>
  <p class="sub">Edit, approve or delete posts. Only <b>approved</b> posts get scheduled when you run <code>refill.py</code>. Nothing is sent from this page.</p>
  <div class="bar" id="tabs"></div>
  <div id="list"></div>
  <button class="act" id="add">+ New post</button>
</main>
<div class="foot"><span id="msg"></span><button class="act pri" id="save">Save changes</button></div>
<script>
const LIMITS={twitter:280,bluesky:300,threads:500,mastodon:500,linkedin:3000,facebook:3000,instagram:2200};
let S={items:[],channels:[]}, filter='all', dirty=false;
const $=(s)=>document.querySelector(s);
function el(tag,props={},...kids){const e=document.createElement(tag);Object.assign(e,props);for(const k of kids)e.append(k);return e}
function setMsg(t){$('#msg').textContent=t}
function mark(){dirty=true;setMsg('Unsaved changes')}
function kind(i){return i.scheduled?'scheduled':i.status}
async function load(){const r=await fetch('/api/state');S=await r.json();dirty=false;setMsg(S.timezone+' time zone');render()}
function render(){
  const tabs=$('#tabs');tabs.replaceChildren();
  for(const [k,n] of [['all','All'],['draft','Drafts'],['approved','Approved'],['scheduled','In Buffer']]){
    const c=S.items.filter(i=>k==='all'||kind(i)===k).length;
    const b=el('button',{className:'tab',textContent:`${n} (${c})`});b.setAttribute('aria-pressed',filter===k);
    b.onclick=()=>{filter=k;render()};tabs.append(b)}
  const list=$('#list');list.replaceChildren();
  const shown=S.items.filter(i=>filter==='all'||kind(i)===filter);
  if(!shown.length)list.append(el('div',{className:'empty',textContent:'Nothing here yet.'}));
  for(const i of shown)list.append(card(i));
}
function card(i){
  const locked=i.scheduled, c=el('div',{className:'card'+(locked?' locked':'')});
  const k=kind(i), top=el('div',{className:'top'});
  top.append(el('span',{className:'badge '+k,textContent:locked?'In Buffer':(i.status==='approved'?'Approved':'Draft')}));
  const d=el('input',{type:'datetime-local',value:i.due_local,disabled:locked});d.oninput=()=>{i.due_local=d.value;mark()};
  top.append(d);
  if(i.source)top.append(el('a',{className:'src',href:i.source,target:'_blank',rel:'noopener',textContent:'source article'}));
  c.append(top);
  for(const ch of S.channels){
    if(!(ch in i.text)&&locked)continue;
    const lim=LIMITS[ch]||3000, lab=el('label',{textContent:ch}), cnt=el('span',{className:'count'});
    lab.append(cnt);
    const t=el('textarea',{value:i.text[ch]||'',disabled:locked,placeholder:'Leave empty to skip this network'});
    const upd=()=>{const n=t.value.length;cnt.textContent=`${n}/${lim}`;cnt.className='count'+(n>lim?' over':'')};
    t.oninput=()=>{i.text[ch]=t.value;upd();mark()};upd();
    c.append(lab,t);
  }
  if(!locked){
    const row=el('div',{className:'row'});
    const ap=el('button',{className:'act'+(i.status==='approved'?'':' pri'),textContent:i.status==='approved'?'Move back to draft':'Approve'});
    ap.onclick=()=>{i.status=i.status==='approved'?'draft':'approved';mark();render()};
    const dl=el('button',{className:'act del',textContent:'Delete'});
    dl.onclick=()=>{S.items=S.items.filter(x=>x!==i);mark();render()};
    row.append(ap,dl);c.append(row);
  }
  return c;
}
$('#add').onclick=()=>{
  const d=new Date(Date.now()+864e5);const p=n=>String(n).padStart(2,'0');
  S.items.push({id:'post-'+Date.now(),due_local:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T09:30`,status:'draft',source:'',scheduled:false,text:Object.fromEntries(S.channels.map(c=>[c,'']))});
  filter='draft';mark();render();scrollTo(0,document.body.scrollHeight)};
$('#save').onclick=async()=>{
  const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Buffer-Queue':'1'},body:JSON.stringify({items:S.items})});
  const j=await r.json();
  if(!r.ok){setMsg('Could not save: '+j.error);return}
  S=j;dirty=false;setMsg('Saved at '+new Date().toLocaleTimeString());render()};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
load();
</script>
</body>
</html>
